[package]
name = "delcc-app"
version = "0.3.10-alpha"
description = "delcc — custom frontend (not TMATH's work)"
authors = ["He"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Phase 3 [claude] lane: tauri-plugin-updater + pubkey + endpoints.
# deliberately unwired here — the check binary must boot with zero config.
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# CPH lane 1 (Job Object memory cap). windows-sys is optional and enabled by the
# `job-mem-cap` feature, which IS in the default set: pass #50 verified the Job
# Object FFI on the dev box and made it default-on (GETTING_STARTED §6). The old
# "OFF by default — unverified" comment above this block predates that flip and
# was wrong; fixed in pass #75.
[target.'cfg(windows)'.dependencies]
# Win32_Security_Cryptography: pass #78 secure store (CryptProtectData token blobs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"], optional = true }

[features]
default = ["custom-protocol", "fonts-enum", "job-mem-cap", "secure-store"]
custom-protocol = ["tauri/custom-protocol"]
job-mem-cap = ["dep:windows-sys"]
# fonts-enum: registry-only font harvest (default on; pure RegReads, no process mutation)
fonts-enum = ["dep:windows-sys"]
# secure-store: DPAPI token store (pass #78; default on — SECURITY.md documents the posture)
secure-store = ["dep:windows-sys"]

# pass #65: the default release profile shipped unstripped. No runtime behavior
# change — symbols out, thin LTO + one codegen unit (full LTO's link step is a
# commit-exhaustion hazard on the dev box; thin keeps the size win).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
